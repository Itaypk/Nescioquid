# JitPack builds this repo on demand when a consumer requests a tag/commit.
# Both modules require the JVM 25 toolchain, so JitPack must build on JDK 25.
# JitPack's stock JDKs may not include 25 yet; install it via sdkman first.
before_install:
  - sdk install java 25-open < /dev/null || true
  - sdk use java 25-open
jdk:
  - openjdk25
install:
  - ./gradlew publishToMavenLocal -x test
