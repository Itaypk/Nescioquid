# JitPack builds this repo on demand when a consumer requests a tag/commit.
#
# Gradle itself runs on JitPack's JDK 17; the JVM 25 toolchain the modules require is
# auto-provisioned by the foojay-resolver plugin (see settings.gradle.kts), so JitPack
# needs no JDK 25 of its own. Tests are skipped here (CI already runs them) — this build
# only needs to produce and install the artifacts.
jdk:
  - openjdk17
install:
  - ./gradlew publishToMavenLocal -x test
