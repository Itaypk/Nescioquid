name: Release

# On every push to main: if the version in gradle.properties has no matching git tag yet,
# build, tag it, and trigger + verify the JitPack build for each module. When the tag already
# exists (no version bump) the job is a cheap no-op. Cut a release by bumping `version` and merging.
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to check whether this version was already released

      - name: Resolve version and check for existing tag
        id: check
        run: |
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ -z "$version" ]; then
            echo "::error::No version= entry in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $version already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Releasing version $version."
          fi

      - name: Set up JDK 25
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew build --no-daemon

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Trigger and verify JitPack builds
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # JitPack builds asynchronously: requesting a module's .pom triggers the build but returns
          # 404 until it finishes (200 on success). So poll both modules' poms until each is 200,
          # short-circuiting to a failure if the shared repo build.log reports one. The whole repo
          # builds once, so one build.log covers both modules.
          set -u
          buildlog="https://jitpack.io/com/github/Itaypk/Nescioquid/${VERSION}/build.log"
          deadline=$(( $(date +%s) + 1500 )) # give JitPack up to 25 minutes
          while :; do
            all_ok=1
            for module in envelope-crypto openrouter-client; do
              pom="https://jitpack.io/com/github/Itaypk/Nescioquid/${module}/${VERSION}/${module}-${VERSION}.pom"
              code="$(curl -sSL --max-time 60 -o /dev/null -w '%{http_code}' "$pom" || echo 000)"
              echo "${module}: HTTP ${code}"
              [ "$code" = "200" ] || all_ok=0
            done
            if [ "$all_ok" = "1" ]; then
              echo "✅ Both modules published on JitPack (${VERSION})."
              exit 0
            fi
            # A failed build won't ever 200 — bail out as soon as the log records the failure.
            if curl -sSL --max-time 60 "$buildlog" 2>/dev/null | grep -qE 'BUILD FAILED|Build failed'; then
              echo "::error::JitPack build failed for ${VERSION}. Log: ${buildlog}"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for JitPack to publish ${VERSION}. Log: ${buildlog}"
              exit 1
            fi
            sleep 20
          done
