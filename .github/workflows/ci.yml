name: CI

# Compile + test both modules. Runs on PRs (the verification gate) and on pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon
        # OpenRouterIntegrationTest reads these via System.getenv and skips itself (assumeTrue) when
        # the key is absent — which is what happens on pull requests from forks, since GitHub does
        # not expose secrets to those runs. Same-repo branches do get the key and run the live tests.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TEST_MODEL: ${{ secrets.OPENROUTER_TEST_MODEL }}
